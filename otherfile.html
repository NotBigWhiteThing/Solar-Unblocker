<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Unblocker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #101014;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    text-align: center;
    background: #1b1b23;
    padding: 40px;
    border-radius: 18px;
    width: min(90%, 430px);
}

h1 {
    margin-bottom: 10px;
}

p {
    color: #aaa;
    line-height: 1.6;
}

button, select {
    background: #6c5ce7;
    border: none;
    color: white;
    padding: 15px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 15px;
    width: 100%;
}

button:hover {
    background: #8174f5;
}

#status {
    margin-top: 20px;
    font-size: 13px;
    color: #aaa;
}

.section {
    margin-top: 25px;
    padding-top: 15px;
    border-top: 1px solid #393943;
}
</style>
</head>

<body>

<audio id="backgroundMusic" loop>
    <source src="idiot.mp3" type="audio/mpeg">
</audio>

<div class="container">

    <h1>✨ Solar Unblocker</h1>

    <p>
        Welcome to Solar Unblocker!
        Launch websites, enable notifications,
        and enjoy some background music.
    </p>

    <div class="section">
        <h3>🌐 Website Launcher</h3>

        <select id="website">
            <option value="https://neal.fun">Neal.fun</option>
            <option value="https://coolmathgames.com">Cool Math Games</option>
            <option value="https://reddit.com">Reddit</option>
            <option value="https://twitter.com">Twitter / X</option>
            <option value="https://now.gg">Now.gg</option>
            <option value="https://google.com">Google</option>
        </select>

        <button onclick="openWebsite()">
            Open Website
        </button>
    </div>

    <div class="section">
        <h3>🚀 Rammerhead</h3>

        <button onclick="rammerhead()">
            Load Rammerhead
        </button>
    </div>

    <div class="section">
        <h3>⚙️ Settings</h3>

        <button onclick="enableNotifications()">
            Enable Notifications
        </button>

        <button onclick="toggleMusic()">
            Toggle Music
        </button>
    </div>

    <div id="status">Waiting to start...</div>

</div>

<script>

// =================================
// CUSTOM SETTINGS
// =================================

const IMAGE_PATH = "satisfying.png";

const POPUP_COUNT = 20;
const NOTIFICATION_COUNT = 20;

// =================================
// WEBSITE LIST
// =================================

const rammerheadSites = [
    "https://coolmathgames.com",
    "https://math.kazwire.com",
    "https://neal.fun",
    "https://cookieduck-dev.github.io",
    "https://poets.kazwire.com",
    "https://monkeygg2.github.io",
    "https://kazwire.com",
    "https://ytmp3.cc",
    "https://ytmp3.nu",
    "https://ytmp3.plus",
    "https://sites.google.com/site/classroom6x/",
    "https://ytmp3.press",
    "https://ytmp3.art",
    "https://en.loader.to/4/",
    "https://ytmp3.hair",
    "https://now.gg",
    "https://sites.google.com/view/class-room-6x/",
    "https://edit.coolmath-games.com",
    "https://now.us",
    "https://xn--31byd1i.net",
    "https://nachderstille.de/",
    "https://google.com/search?q=unblocker%20proxy/",
    "https://nordvpn.com/",
    "https://ww1.ytmp3.com.se/",
    "https://ytmp3.pub/",
    "https://twitter.com",
    "https://reddit.com",
    "https://ytmp3.show/",
    "https://canvas.instructure.cf",
    "https://ballbang.com/"
];

// =================================
// RAMMERHEAD
// =================================

function rammerhead() {

    const status = document.getElementById("status");

    // Open the Rammerhead popup enable page.
    const tab = window.open(
        "https://blobby-boi.github.io/RammerheadPR0XY/popupenable.html",
        "_blank"
    );

    if (!tab) {
        status.textContent =
            "Rammerhead popup was blocked.";
        return;
    }

    status.textContent =
        "Rammerhead launcher opened. Use the website launcher for other sites.";
}

// =================================
// WEBSITE LAUNCHER
// =================================

function openWebsite() {

    const url = document.getElementById("website").value;

    const tab = window.open(url, "_blank");

    if (!tab) {
        document.getElementById("status").textContent =
            "Popup blocked! Allow popups for this website.";
        return;
    }

    document.getElementById("status").textContent =
        "Website opened successfully!";
}

// =================================
// NOTIFICATIONS
// =================================

async function enableNotifications() {

    const status = document.getElementById("status");

    if (!("Notification" in window)) {
        status.textContent =
            "Notifications are not supported.";
        return;
    }

    try {

        const permission =
            await Notification.requestPermission();

        if (permission === "granted") {

            const count = Math.min(
                Math.max(0, Math.floor(NOTIFICATION_COUNT)),
                20
            );

            for (let i = 0; i < count; i++) {

                new Notification("Solar Unblocker", {
                    body: "Solar Unblocker notification #" + (i + 1),
                    icon: IMAGE_PATH,
                    tag: "solar-" + i
                });

            }

            status.textContent =
                count + " notifications sent!";

        } else {

            status.textContent =
                "Notification permission not granted.";

        }

    } catch (error) {

        status.textContent =
            "Notification error: " + error.message;

        console.error(error);
    }
}

// =================================
// MUSIC
// =================================

async function toggleMusic() {

    const music =
        document.getElementById("backgroundMusic");

    const status =
        document.getElementById("status");

    try {

        if (music.paused) {

            music.volume = 0.35;
            await music.play();

            status.textContent = "Music playing!";

        } else {

            music.pause();

            status.textContent = "Music paused!";

        }

    } catch (error) {

        status.textContent = "Could not play music.";
        console.error(error);

    }
}

</script>

</body>
</html>
